services:
  tesis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tesis_gestos
    working_dir: /workspace
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./:/workspace
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    command:
      - bash
      - -lc
      - python3 -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tesis_gestos_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - tesis

volumes:
  frontend_node_modules:
